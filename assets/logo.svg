<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" role="img" aria-label="GitHub Green Squares Logo">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="logoArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006d32" />
      <stop offset="40%" stop-color="#26a641" />
      <stop offset="75%" stop-color="#39d353" />
      <stop offset="100%" stop-color="#00f59b" />
    </linearGradient>

    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="50%" stop-color="#39d353" />
      <stop offset="100%" stop-color="#00f59b" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon Container -->
  <g transform="translate(6, 6) scale(0.52)">
    <!-- Container Squircle -->
    <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#logoBgGrad)" stroke="#30363d" stroke-width="2" />

    <!-- Heatmap Contribution Squares -->
    <rect x="20" y="28" width="10" height="10" rx="2.5" fill="#161b22" />
    <rect x="33" y="28" width="10" height="10" rx="2.5" fill="#0e4429" />
    <rect x="46" y="28" width="10" height="10" rx="2.5" fill="#26a641" />
    <rect x="59" y="28" width="10" height="10" rx="2.5" fill="#39d353" />

    <rect x="20" y="41" width="10" height="10" rx="2.5" fill="#0e4429" />
    <rect x="33" y="41" width="10" height="10" rx="2.5" fill="#26a641" />
    <rect x="46" y="41" width="10" height="10" rx="2.5" fill="#39d353" />
    <rect x="59" y="41" width="10" height="10" rx="2.5" fill="#00f59b" />

    <rect x="20" y="54" width="10" height="10" rx="2.5" fill="#26a641" />
    <rect x="33" y="54" width="10" height="10" rx="2.5" fill="#39d353" />
    <rect x="46" y="54" width="10" height="10" rx="2.5" fill="#00f59b" />
    <rect x="59" y="54" width="10" height="10" rx="2.5" fill="#39d353" />

    <rect x="20" y="67" width="10" height="10" rx="2.5" fill="#0e4429" />
    <rect x="33" y="67" width="10" height="10" rx="2.5" fill="#26a641" />
    <rect x="46" y="67" width="10" height="10" rx="2.5" fill="#39d353" />
    <rect x="59" y="67" width="10" height="10" rx="2.5" fill="#26a641" />

    <!-- Upward Momentum Arc & Arrow -->
    <path d="M 18 76 C 26 76, 38 68, 54 48 C 66 32, 72 24, 76 20"
          stroke="url(#logoArrowGrad)" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#logoGlow)" />
    <path d="M 64 18 L 82 17 L 81 35 L 75 29 L 69 35 Z" fill="url(#logoArrowGrad)" filter="url(#logoGlow)" />

    <!-- Stars -->
    <path d="M 72 10 Q 73 13 76 14 Q 73 15 72 18 Q 71 15 68 14 Q 71 13 72 10 Z" fill="#00f59b" />
  </g>

  <!-- Typography -->
  <text x="68" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">GitHub <tspan fill="url(#logoTextGrad)">Green Squares</tspan></text>
  <text x="69" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#8b949e" letter-spacing="1.2">DEVELOPER CONTRIBUTION ANALYTICS</text>
</svg>
