<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="GitHub Green Squares Logo Mark">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Neon Emerald Glow -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006d32" />
      <stop offset="35%" stop-color="#26a641" />
      <stop offset="70%" stop-color="#39d353" />
      <stop offset="100%" stop-color="#00f59b" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#39d353" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.8" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Heatmap Contribution Squares (4x4 Grid in lower-left) -->
  <!-- Row 1 (y=28) -->
  <rect x="20" y="28" width="10" height="10" rx="2.5" fill="#161b22" />
  <rect x="33" y="28" width="10" height="10" rx="2.5" fill="#0e4429" />
  <rect x="46" y="28" width="10" height="10" rx="2.5" fill="#26a641" />
  <rect x="59" y="28" width="10" height="10" rx="2.5" fill="#39d353" />

  <!-- Row 2 (y=41) -->
  <rect x="20" y="41" width="10" height="10" rx="2.5" fill="#0e4429" />
  <rect x="33" y="41" width="10" height="10" rx="2.5" fill="#26a641" />
  <rect x="46" y="41" width="10" height="10" rx="2.5" fill="#39d353" />
  <rect x="59" y="41" width="10" height="10" rx="2.5" fill="#00f59b" />

  <!-- Row 3 (y=54) -->
  <rect x="20" y="54" width="10" height="10" rx="2.5" fill="#26a641" />
  <rect x="33" y="54" width="10" height="10" rx="2.5" fill="#39d353" />
  <rect x="46" y="54" width="10" height="10" rx="2.5" fill="#00f59b" />
  <rect x="59" y="54" width="10" height="10" rx="2.5" fill="#39d353" />

  <!-- Row 4 (y=67) -->
  <rect x="20" y="67" width="10" height="10" rx="2.5" fill="#0e4429" />
  <rect x="33" y="67" width="10" height="10" rx="2.5" fill="#26a641" />
  <rect x="46" y="67" width="10" height="10" rx="2.5" fill="#39d353" />
  <rect x="59" y="67" width="10" height="10" rx="2.5" fill="#26a641" />

  <!-- Upward Growth Momentum Arc -->
  <path d="M 18 76 C 26 76, 38 68, 54 48 C 66 32, 72 24, 76 20"
        stroke="url(#arrowGrad)" stroke-width="5.5" stroke-linecap="round" fill="none" filter="url(#neonGlow)" />

  <!-- Arrowhead pointing up-right -->
  <path d="M 64 18 L 82 17 L 81 35 L 75 29 L 69 35 Z"
        fill="url(#arrowGrad)" filter="url(#neonGlow)" />

  <!-- Momentum Stars / Sparkles -->
  <path d="M 72 10 Q 73 13 76 14 Q 73 15 72 18 Q 71 15 68 14 Q 71 13 72 10 Z" fill="#00f59b" />
  <path d="M 84 42 Q 85 44 87 45 Q 85 46 84 48 Q 83 46 81 45 Q 83 44 84 42 Z" fill="#39d353" />
</svg>
